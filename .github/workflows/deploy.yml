name: Deploy Wardrub

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: gen-lang-client-0842206246
  REGION: us-central1
  SERVICE_NAME: wardrub-api
  AR_REPO: wardrub
  ALLOWED_ORIGINS: "https://wardrub.hardk.space,https://hardk.space,https://hardik-uppal.github.io,http://localhost:5173"

jobs:
  deploy-backend:
    name: Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }} backend/
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Prepare Base64 Credentials
        run: |
          cat << 'EOF' > /tmp/sa.json
          ${{ secrets.GCP_CREDENTIALS }}
          EOF
          B64_JSON=$(base64 -w 0 /tmp/sa.json)
          echo "::add-mask::$B64_JSON"
          echo "GCP_SERVICE_ACCOUNT_KEY_B64=$B64_JSON" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          env_vars: |-
            GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}
            GCS_BUCKET=wardrub-assets-1
            ALLOWED_ORIGINS=${{ env.ALLOWED_ORIGINS }}
            VERTEX_AI_LOCATION=${{ env.REGION }}
            GEMINI_MODEL_TYPE=flash
            GEMINI_TEXT_MODEL=gemini-3.1-flash-lite
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }}
            FAL_KEY=${{ secrets.FAL_KEY }}
            GCP_SERVICE_ACCOUNT_KEY_B64=${{ env.GCP_SERVICE_ACCOUNT_KEY_B64 }}

  deploy-frontend:
    name: Deploy Frontend to GitHub Pages
    runs-on: ubuntu-latest
    needs: deploy-backend # Wait for backend to be deployed (though URL is static, it's safer)
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Create Production Environment Variables
        run: |
          cat << EOF > frontend/.env.production
          VITE_API_URL=https://wardrub-api-1028744939274.us-central1.run.app
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=gen-lang-client-0842206246.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=gen-lang-client-0842206246
          VITE_FIREBASE_STORAGE_BUCKET=gen-lang-client-0842206246.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID=1028744939274
          VITE_FIREBASE_APP_ID=1:1028744939274:web:832d2b8d48fee7ffb19cf3
          EOF

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Configure CNAME
        working-directory: ./frontend/dist
        run: echo "wardrub.hardk.space" > CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          force_orphan: true
